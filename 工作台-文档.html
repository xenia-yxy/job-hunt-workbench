<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文档</title>
<style>
:root{--bg:#14161a;--panel:#1c1f26;--panel2:#232731;--line:#2e333e;--ink:#e8ebf1;--mut:#8b93a3;--accent:#7aa8ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{display:flex;max-width:none;margin:0 auto;gap:22px;padding:22px 20px 70px}
.main{flex:1;min-width:0}
.hd{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.hd .path{font-size:11px;color:var(--mut);word-break:break-all}
.hd h1{margin:6px 0 0;font-size:20px;line-height:1.4}
.hd .meta{margin-top:6px;font-size:11px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap}
.toc{width:196px;flex-shrink:0;position:sticky;top:22px;align-self:flex-start;
  font-size:11.5px;color:var(--mut);max-height:calc(100vh - 44px);overflow-y:auto}
.toc h4{margin:0 0 8px;font-size:10.5px;letter-spacing:.6px;color:var(--mut);font-weight:600}
.toc a{display:block;color:var(--mut);text-decoration:none;padding:3px 8px;border-left:2px solid transparent;
  border-radius:0 5px 5px 0;line-height:1.5;word-break:break-word}
.toc a:hover{color:var(--ink);background:var(--panel)}
.toc a.lv3{padding-left:18px;opacity:.8}
.toc a.on{color:#cfe0ff;border-left-color:var(--accent);background:rgba(122,168,255,.1)}

article h1{font-size:21px;margin:26px 0 12px;line-height:1.4}
article h2{font-size:17px;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
article h3{font-size:14.5px;margin:20px 0 8px}
article h4{font-size:13.5px;margin:16px 0 6px;color:#c6cdd9}
article p{margin:9px 0}
article ul,article ol{margin:9px 0;padding-left:22px}
article li{margin:4px 0}
article blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid #3b4658;
  background:var(--panel);color:#c2cad8;border-radius:0 8px 8px 0}
article blockquote p{margin:4px 0}
article hr{border:0;border-top:1px solid var(--line);margin:22px 0}
article code{background:var(--panel2);border-radius:4px;padding:1px 5px;font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
article pre.code{background:#0f1216;border:1px solid var(--line);border-radius:9px;padding:12px 14px;
  overflow-x:auto;margin:12px 0}
article pre.code code{background:transparent;padding:0;font-size:12px;line-height:1.65}
article a{color:#8fbcfb;text-decoration:none;border-bottom:1px solid rgba(143,188,251,.3)}
article a:hover{color:#b7d5ff}
article strong{color:#f2f5fa}
article table{border-collapse:collapse;width:100%;margin:12px 0;font-size:12.5px;display:block;overflow-x:auto}
article th,article td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
article th{background:var(--panel2);color:#c6cdd9;font-weight:600;white-space:nowrap}
article tbody tr:nth-child(even){background:rgba(255,255,255,.015)}
article img{max-width:100%}

.err{margin:24px 0;padding:16px 18px;border:1px solid rgba(240,122,122,.35);
  background:rgba(240,122,122,.07);border-radius:10px;font-size:13px;line-height:1.9}
.err b{color:#f4a3a3}
.err code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:12px}
.loading{color:var(--mut);font-size:13px;padding:20px 0}
@media(max-width:820px){.toc{display:none}}
@media(max-width:760px){.shell{padding:16px 12px 60px}}
</style>
<link rel="stylesheet" href="/assets/ui.css">
<script src="/assets/ui.js"></script></head>
<body>
<div class="shell">
  <div class="main">
    <div class="hd">
      <div class="path" id="path">正在解析文档路径…</div>
      <h1 id="title">加载中…</h1>
      <div class="meta" id="meta"></div>
    </div>
    <article id="doc"><div class="loading">正在读取…</div></article>
  </div>
  <aside class="toc" id="toc" hidden><h4>目录</h4><div id="tocList"></div></aside>
</div>
<script>
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ---- 轻量 Markdown：只覆盖项目内 md 实际用到的语法 -------------------------
function inline(s){
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t;
}
function splitRow(line){
  let s = line.trim();
  if(s.charAt(0) === '|') s = s.slice(1);
  if(s.charAt(s.length-1) === '|') s = s.slice(0,-1);
  return s.split('|').map(x => x.trim());
}
function slug(s, n){
  const base = String(s).replace(/<[^>]+>/g,'').replace(/[^\w\u4e00-\u9fa5]+/g,'-').slice(0,40);
  return 'h-' + (base || 'sec') + '-' + n;
}
function renderList(lines, start){
  const baseIndent = (lines[start].match(/^\s*/) || [''])[0].length;
  const head = lines[start].trim();
  const tag = /^\d+[.)]/.test(head) ? 'ol' : 'ul';
  let html = '<' + tag + '>', i = start;
  while(i < lines.length){
    const m = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
    if(!m) break;
    const indent = m[1].replace(/\t/g,'  ').length;
    if(indent < baseIndent) break;
    if(indent > baseIndent){
      const sub = renderList(lines, i);
      html += sub.html; i = sub.next; continue;
    }
    let text = m[3];
    i++;
    while(i < lines.length && lines[i].trim() &&
          /^\s{2,}/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){
      text += ' ' + lines[i].trim(); i++;
    }
    html += '<li>' + inline(text) + '</li>';
  }
  return {html: html + '</' + tag + '>', next: i};
}
function md2html(src){
  const lines = String(src).replace(/\r\n/g,'\n').split('\n');
  const out = []; let i = 0, hn = 0;
  while(i < lines.length){
    const line = lines[i];
    if(/^```/.test(line)){
      const buf = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push('<pre class="code"><code>' + esc(buf.join('\n')) + '</code></pre>');
      continue;
    }
    if(/^(---|\*\*\*|___)\s*$/.test(line)){ out.push('<hr>'); i++; continue; }
    let m = /^(#{1,6})\s+(.*)$/.exec(line);
    if(m){
      const n = m[1].length; hn++;
      out.push('<h'+n+' id="'+slug(m[2], hn)+'">'+inline(m[2])+'</h'+n+'>');
      i++; continue;
    }
    if(/^\s*\|/.test(line) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const head = splitRow(line); i += 2;
      const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(splitRow(lines[i++]));
      out.push('<table><thead><tr>' + head.map(h => '<th>'+inline(h)+'</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + r.map(c => '<td>'+inline(c)+'</td>').join('') + '</tr>').join('') +
        '</tbody></table>');
      continue;
    }
    if(/^>\s?/.test(line)){
      const buf = [];
      while(i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,''));
      out.push('<blockquote>' + md2html(buf.join('\n')) + '</blockquote>');
      continue;
    }
    if(/^\s*([-*+]|\d+[.)])\s+/.test(line)){
      const r = renderList(lines, i); out.push(r.html); i = r.next; continue;
    }
    if(!line.trim()){ i++; continue; }
    const buf = [];
    while(i < lines.length && lines[i].trim() &&
          !/^(#{1,6}\s|```|>)/.test(lines[i]) &&
          !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) &&
          !/^\s*\|/.test(lines[i]) &&
          !/^(---|\*\*\*|___)\s*$/.test(lines[i])){
      buf.push(lines[i++]);
    }
    if(buf.length) out.push('<p>' + inline(buf.join(' ')) + '</p>');
    else i++;
  }
  return out.join('\n');
}

function buildToc(){
  const hs = $('doc').querySelectorAll('h1,h2,h3');
  if(hs.length < 2){ $('toc').hidden = true; return; }
  $('tocList').innerHTML = Array.prototype.map.call(hs, h => {
    const lv = h.tagName === 'H3' ? ' class="lv3"' : '';
    return '<a href="#'+h.id+'"'+lv+'>'+esc(h.textContent)+'</a>';
  }).join('');
  $('toc').hidden = false;
  $('tocList').querySelectorAll('a').forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      const t = document.getElementById(a.getAttribute('href').slice(1));
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
}

async function load(){
  const src = new URLSearchParams(location.search).get('src') || '';
  $('path').textContent = src || '（缺少 ?src= 参数）';
  if(!src){
    $('title').textContent = '未指定文档';
    $('doc').innerHTML = '<div class="err"><b>缺少文档路径</b><br>' +
      '用法：<code>工作台-文档.html?src=路径/文件.md</code><br>' +
      '只允许读取配置白名单（<code>sources.doc_roots</code> / <code>sources.doc_allow</code>）内的 Markdown。</div>';
    return;
  }
  try{
    const r = await fetch('/api/doc?src=' + encodeURIComponent(src), {cache:'no-store'});
    const ct = r.headers.get('content-type') || '';
    if(!r.ok){
      let j = {};
      try { j = await r.json(); } catch(e){}
      const map = {
        FORBIDDEN:'该文件不在文档白名单内', NOT_FOUND:'文件不存在', TRAVERSE:'路径越界，已拒绝',
        TYPE:'只支持 Markdown 文件', EMPTY:'缺少 src 参数', NOT_FILE:'目标不是文件'
      };
      $('title').textContent = '无法打开';
      $('meta').innerHTML = '<span>' + esc(j.code || ('HTTP ' + r.status)) + '</span>';
      $('doc').innerHTML = '<div class="err"><b>' + esc(map[j.code] || '读取失败') + '</b><br>' +
        esc(j.hint || '') + '<br><span style="color:#8b93a3">路径：' + esc(src) + '</span></div>';
      return;
    }
    const text = await r.text();
    const firstH1 = (text.match(/^#\s+(.+)$/m) || [])[1] || src.split('/').pop();
    document.title = firstH1;
    $('title').textContent = firstH1;
    const mtime = r.headers.get('x-doc-mtime') || '';
    $('meta').innerHTML = '<span>' + text.length.toLocaleString() + ' 字符</span>' +
      (mtime ? '<span>更新于 ' + esc(mtime.replace('T',' ').slice(0,16)) + '</span>' : '') +
      '<span>只读渲染 · 不写盘</span>';
    $('doc').innerHTML = md2html(text);
    // 正文首个 h1 与页头标题重复，移除（目录从 h2 起更清爽）
    const firstEl = $('doc').firstElementChild;
    if(firstEl && firstEl.tagName === 'H1' && firstEl.textContent.trim() === firstH1.trim()){
      firstEl.remove();
    }
    // 外链在 iframe 内统一开新标签，避免整页被替换
    $('doc').querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if(/^https?:/i.test(href)){ a.target = '_blank'; a.rel = 'noopener'; }
    });
    buildToc();
  }catch(e){
    $('title').textContent = '接口不可用';
    $('doc').innerHTML = '<div class="err"><b>读不到 /api/doc</b><br>' +
      '请确认本地服务（8787）正在运行。</div>';
  }
}
load();
</script>
</body></html>
